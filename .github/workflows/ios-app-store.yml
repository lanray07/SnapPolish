name: iOS App Store Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-app-store.yml"
      - "SnapPolish/**"
      - "SnapPolish.xcodeproj/**"
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: "Upload the exported IPA to App Store Connect"
        required: true
        type: boolean
        default: true
      build_number:
        description: "Optional CFBundleVersion override"
        required: false
        type: string

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-and-upload:
    name: Archive and Upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT_PATH: SnapPolish.xcodeproj
      SCHEME: SnapPolish
      CONFIGURATION: Release
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPSTORE_API_KEY_ID || secrets.APPLE_API_KEY_ID || secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID || secrets.APPLE_API_ISSUER_ID || secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY || secrets.APPLE_API_PRIVATE_KEY || secrets.ASC_PRIVATE_KEY }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPLE_API_PRIVATE_KEY_BASE64 || secrets.ASC_PRIVATE_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.APPLE_DEVELOPMENT_TEAM || secrets.DEVELOPMENT_TEAM || secrets.TEAM_ID }}
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER || secrets.BUNDLE_IDENTIFIER || secrets.APP_IDENTIFIER || 'com.snappolish.app' }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.IOS_CERTIFICATE_BASE64 || secrets.DISTRIBUTION_CERTIFICATE_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 || secrets.CERTIFICATE_BASE64 || secrets.P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD || secrets.CERTIFICATE_PASSWORD || secrets.P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || secrets.IOS_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.PROVISIONING_PROFILE_BASE64 || secrets.PROVISION_PROFILE_BASE64 || secrets.MOBILEPROVISION_BASE64 || secrets.PROFILE_BASE64 }}
      EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'app-store-connect' }}
      BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number }}
      UPLOAD_TO_APP_STORE_CONNECT: ${{ github.event_name == 'push' || github.event.inputs.upload_to_app_store_connect == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          fi
          xcodebuild -version

      - name: Validate CI secrets
        run: |
          set -euo pipefail
          require_value() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is required. Add it as a GitHub Actions repository secret."
              exit 1
            fi
          }

          require_value ASC_KEY_ID
          require_value ASC_ISSUER_ID
          require_value APPLE_TEAM_ID
          require_value IOS_BUNDLE_IDENTIFIER
          require_value IOS_DISTRIBUTION_CERTIFICATE_BASE64
          require_value IOS_PROVISIONING_PROFILE_BASE64

          if [ -z "${ASC_PRIVATE_KEY:-}" ] && [ -z "${ASC_PRIVATE_KEY_BASE64:-}" ]; then
            echo "::error::Add APP_STORE_CONNECT_API_PRIVATE_KEY or APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 as a GitHub Actions secret."
            exit 1
          fi

      - name: Prepare App Store Connect API key
        id: appstore-key
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/private_keys"
          ASC_KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR" "$HOME/.appstoreconnect/private_keys"

          if [ -n "${ASC_PRIVATE_KEY_BASE64:-}" ]; then
            printf "%s" "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH" 2>/dev/null || \
              printf "%s" "$ASC_PRIVATE_KEY_BASE64" | base64 -D > "$ASC_KEY_PATH"
          else
            printf "%s" "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          fi

          perl -0pi -e 's/\\n/\n/g' "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "path=$ASC_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Install signing certificate and provisioning profile
        id: signing
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf "%s" "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null || \
            printf "%s" "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH" 2>/dev/null || \
            printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Prepare export options
        id: export-options
        run: |
          set -euo pipefail
          if ! xcodebuild -help 2>&1 | grep -q "app-store-connect"; then
            EXPORT_METHOD="app-store"
          fi

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_IDENTIFIER</key>
              <string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"
          cat "$EXPORT_OPTIONS"
          echo "path=$EXPORT_OPTIONS" >> "$GITHUB_OUTPUT"

      - name: Show Xcode project metadata
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Archive
        run: |
          set -euo pipefail
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-$GITHUB_RUN_NUMBER}"
          ARCHIVE_PATH="$RUNNER_TEMP/SnapPolish.xcarchive"
          mkdir -p build/logs

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            clean archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            | tee build/logs/archive.log

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Export IPA
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH" build/logs

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "${{ steps.export-options.outputs.path }}" \
            -exportPath "$EXPORT_PATH" \
            -authenticationKeyPath "${{ steps.appstore-key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/logs/export.log

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name "*.ipa" -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA was exported."
            exit 1
          fi

          mkdir -p build/export
          cp "$IPA_PATH" "build/export/SnapPolish-${BUILD_NUMBER}.ipa"
          if [ -d "$ARCHIVE_PATH/dSYMs" ]; then
            ditto -c -k --keepParent "$ARCHIVE_PATH/dSYMs" "build/export/SnapPolish-${BUILD_NUMBER}-dSYMs.zip"
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapPolish-iOS-${{ env.BUILD_NUMBER }}
          path: |
            build/export/*
            build/logs/*
          if-no-files-found: error

      - name: Validate and upload to App Store Connect
        if: env.UPLOAD_TO_APP_STORE_CONNECT == 'true'
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
